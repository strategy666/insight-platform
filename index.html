<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>商业化洞察 v2.0 | 市场情报追踪平台</title>
    <meta name="description" content="商业化战略洞察平台 - 市场情报 & 竞对追踪（公开信息版）" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>" />
    <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<!-- Header -->
<header class="site-header">
    <div class="container">
        <div class="header-inner">
            <a href="#" class="logo">
                <span class="logo-icon">📊</span>
                <span class="logo-text">商业化洞察 <sup>v2</sup></span>
            </a>
            <nav class="nav">
                <a href="#insights" class="nav-link">💡 市场洞察</a>
                <a href="#competitors" class="nav-link">🎯 竞对追踪</a>
            </nav>
            <div class="meta">
                <span class="last-update" id="lastUpdate">更新于 2026-05-26</span>
            </div>
        </div>
    </div>
</header>

<!-- Hero -->
<section class="hero">
    <div class="container">
        <h1>洞察先于决策，数据驱动战略</h1>
        <p class="hero-subtitle">追踪 10+ 竞对 · 180+ 信息源<a href="https://docs.corp.kuaishou.com/d/home/fcAAoE2eWZ9oZFNrZB9qJaYpz" target="_blank" class="sub-link"> (查看渠道 Kim Doc ↗) </a>· 每周自动更新</p>
        
        <!-- Key Stats -->
        <div class="hero-stats">
            <div class="stat-card">
                <div class="stat-num" id="statTotal">9</div>
                <div class="stat-label">情报条目</div>
            </div>
            <div class="stat-card">
                <div class="stat-num stat-high" id="statHigh">6</div>
                <div class="stat-label">高优先级</div>
            </div>
            <div class="stat-card">
                <div class="stat-num" id="statCompanies">8</div>
                <div class="stat-label">跟踪公司</div>
            </div>
            <div class="stat-card" onclick="window.open('https://docs.corp.kuaishou.com/d/home/fcAAoE2eWZ9oZFNrZB9qJaYpz','_blank')" style="cursor:pointer" title="点击查看渠道库 Kim Doc">
                <div class="stat-num" id="statSources">180+</div>
                <div class="stat-label">信息源 ↗</div>
            </div>
        </div>

        <!-- AI Search -->
        <div class="ai-search-container">
            <div class="search-input-wrapper">
                <input type="text" id="aiSearchInput" placeholder="💬 问我任何关于市场情报的问题..." autocomplete="off" onkeypress="if(event.key==='Enter')askAI(this.value)" />
                <button id="aiSearchBtn" class="search-btn" onclick="askAI(document.getElementById('aiSearchInput').value)">搜索</button>
            </div>
            
            <!-- 猜你想搜 -->
            <div class="suggested-questions">
                <button class="suggest-q" onclick="askAI('抖音出单宝对快手本地推有什么影响？')">抖音出单宝对快手本地推有什么影响？</button>
                <button class="suggest-q" onclick="askAI('字节本地生活Q2有哪些重要动作？')">字节本地生活Q2有哪些重要动作？</button>
                <button class="suggest-q" onclick="askAI('腾讯视频号广告增长的核心驱动力是什么？')">腾讯视频号广告增长的核心驱动力是什么？</button>
            </div>
        </div>
    </div>
</section>

<!-- AI Answer Panel (独立区域，初始隐藏) -->
<section id="aiAnswerSection" class="ai-answer-section" style="display:none;">
    <div class="container">
        <div id="aiAnswerPanel" class="ai-answer-panel">
            <button class="close-answer" onclick="closeAIAnswer()" title="关闭">✕</button>
            
            <div class="answer-content">
                <!-- 自然语言回答 -->
                <div class="answer-summary" id="answerSummary"></div>
                
                <!-- 结构化分析 -->
                <div class="answer-analysis" id="answerAnalysis"></div>
                
                <!-- 信息来源 -->
                <div class="answer-sources" id="answerSources"></div>
            </div>
            
            <!-- 相关动态 -->
            <div class="related-updates">
                <h4>📰 相关动态</h4>
                <div id="relatedUpdates" class="related-list"></div>
            </div>
        </div>
    </div>
</section>

<!-- Tab1: 市场洞察 (原Part1+Part3合并) -->
<section id="insights" class="section">
    <div class="container">
        <div class="section-header">
            <h2>💡 市场洞察</h2>
            <p>本周关键情报 · 多维筛选 · So What 解读</p>
        </div>

        <!-- 本周关键（Top 3 高优先级） -->
        <div class="key-insights" id="keyInsights">
            <!-- JS 动态渲染 -->
        </div>

        <!-- 筛选器 -->
        <div class="filters-panel">
            <div class="filter-group">
                <label>优先级</label>
                <div class="filter-btns">
                    <button class="filter-btn active" data-type="priority" data-value="all">全部</button>
                    <button class="filter-btn" data-type="priority" data-value="high">🔴 高</button>
                    <button class="filter-btn" data-type="priority" data-value="mid">🟡 中</button>
                    <button class="filter-btn" data-type="priority" data-value="low">🟢 低</button>
                </div>
            </div>
            <div class="filter-group">
                <label>信号</label>
                <div class="filter-btns">
                    <button class="filter-btn active" data-type="signal" data-value="all">全部</button>
                    <button class="filter-btn" data-type="signal" data-value="opportunity">🟢 机会</button>
                    <button class="filter-btn" data-type="signal" data-value="neutral">🟡 中性</button>
                    <button class="filter-btn" data-type="signal" data-value="threat">🔴 威胁</button>
                </div>
            </div>
            <div class="filter-group">
                <label>赛道</label>
                <div class="filter-btns">
                    <button class="filter-btn active" data-type="track" data-value="all">全部</button>
                    <button class="filter-btn" data-type="track" data-value="本地生活">本地生活</button>
                    <button class="filter-btn" data-type="track" data-value="AI">AI</button>
                    <button class="filter-btn" data-type="track" data-value="线索广告">线索广告</button>
                    <button class="filter-btn" data-type="track" data-value="电商">电商</button>
                    <button class="filter-btn" data-type="track" data-value="出海">出海</button>
                </div>
            </div>
            <div class="filter-group">
                <label>公司</label>
                <div class="filter-btns">
                    <button class="filter-btn active" data-type="company" data-value="all">全部</button>
                    <button class="filter-btn" data-type="company" data-value="字节">字节</button>
                    <button class="filter-btn" data-type="company" data-value="腾讯">腾讯</button>
                    <button class="filter-btn" data-type="company" data-value="小红书">小红书</button>
                    <button class="filter-btn" data-type="company" data-value="百度">百度</button>
                    <button class="filter-btn" data-type="company" data-value="美团">美团</button>
                    <button class="filter-btn" data-type="company" data-value="OpenAI">OpenAI</button>
                    <button class="filter-btn" data-type="company" data-value="Google">Google</button>
                </div>
            </div>
        </div>

        <!-- 情报卡片流 -->
        <div class="insights-grid" id="insightsGrid">
            <!-- JS 动态渲染卡片 -->
        </div>
    </div>
</section>

<!-- Tab2: 竞对追踪 -->
<section id="competitors" class="section section-alt">
    <div class="container">
        <div class="section-header">
            <h2>🎯 竞对追踪</h2>
            <p>竞对产品/政策/动态时间线</p>
        </div>

        <!-- 竞对 Tabs -->
        <div class="competitor-tabs" id="competitorTabs">
            <!-- JS 动态渲染 -->
        </div>

        <!-- 竞对动态列表 -->
        <div class="competitor-updates" id="competitorUpdates">
            <!-- JS 动态渲染 -->
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="site-footer">
    <div class="container">
        <p>© 2026 商业化洞察平台 | 数据来源：公开信息 | 每周自动更新</p>
        <p class="footer-links">
            <a href="https://github.com/strategy666/insight-platform" target="_blank">GitHub</a> ·
            <a href="#" onclick="showChangeLog()">更新日志</a>
        </p>
    </div>
</footer>

<script src="assets/main.js"></script>
<script>
// 兜底：如果 main.js 加载失败或 askAI 未定义，提供基础提示
window.addEventListener('load', function() {
    setTimeout(function() {
        if (typeof window.askAI !== 'function') {
            console.error('[Fallback] askAI 未定义！main.js 可能加载失败');
            window.askAI = function(q) {
                alert('搜索功能暂时不可用，请刷新页面或检查网络。问题：' + q);
            };
        } else {
            console.log('[Fallback] askAI 已就绪 ✅');
        }
    }, 2000);
});
</script>
</body>
</html>
